<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painéis e Sistemas — Executivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F3FA;
    --panel: #FFFFFF;
    --line: #E4DEF0;
    --ink: #241638;
    --muted: #6B6480;
    --accent: #8B1E7A;
    --accent-soft: #F5E4F0;
    --signal: #F2542A;
    --signal-soft: #FDE4DA;
    --ok: #3E9C6E;
    --radius: 10px;
    --grad: linear-gradient(115deg, #3D1F9E 0%, #8B1E7A 45%, #C22A6A 65%, #F2542A 88%, #FF7A1A 100%);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(27,33,48,0.06) 1px, transparent 0) 0 0/24px 24px,
      var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a{ color:inherit; text-decoration:none; }

  /* ---------- header ---------- */
  header{
    background: var(--grad);
    padding: 44px 24px 40px;
    position: relative;
    overflow: hidden;
  }
  header::before{
    /* textura sutil de fundo, sem reproduzir nenhum logo/marca */
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at 85% 15%, rgba(255,255,255,.16), transparent 55%);
    pointer-events:none;
  }
  .header-inner{
    max-width: 980px;
    margin: 0 auto;
    position: relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .header-text{ max-width: 560px; }
  .logo-slot{
    width: 64px;
    height: 64px;
    border-radius: 16px;
    border: 1.5px dashed rgba(255,255,255,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    color: rgba(255,255,255,.75);
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    text-align:center;
    line-height:1.3;
    flex-shrink:0;
    background: rgba(255,255,255,.08);
  }
  .logo-slot img{
    width:100%; height:100%; object-fit:contain; border-radius:14px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(255,255,255,.85);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 14px;
  }
  .eyebrow::before{
    content:"";
    width:8px; height:8px; border-radius:50%;
    background: #7CF2B0;
    box-shadow: 0 0 0 3px rgba(124,242,176,.25);
  }
  h1{
    font-family:'Poppins', sans-serif;
    font-size: clamp(30px, 4.5vw, 44px);
    font-weight: 800;
    color: #fff;
    margin: 0 0 10px;
    letter-spacing: -.01em;
    text-transform: uppercase;
  }
  h1 .nip{
    position: relative;
    display: inline-block;
    padding: 0 6px;
  }
  h1 .nip::after{
    content:"";
    position:absolute;
    left:-4px; right:-4px; bottom:2px;
    height: 10px;
    background: rgba(255,255,255,.28);
    border-radius: 4px;
    z-index:-1;
  }
  header p{
    margin: 0;
    color: rgba(255,255,255,.85);
    font-size: 15px;
    max-width: 46ch;
    line-height: 1.5;
  }

  /* ---------- controls ---------- */
  .controls{
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px 8px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
    padding-top: 8px;
  }
  .search-row{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 14px;
  }
  .search-row svg{ flex-shrink:0; color: var(--muted); }
  #search{
    border:none; outline:none; background:transparent;
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 15px;
    width:100%;
    color: var(--ink);
  }
  #search::placeholder{ color:#9BA2B4; }
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding-bottom: 20px;
  }
  .tab{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing:.03em;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    cursor:pointer;
    transition: all .15s ease;
    user-select:none;
  }
  .tab:hover{ border-color: var(--accent); color: var(--accent); }
  .tab.active{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ---------- grid ---------- */
  main{
    max-width: 980px;
    margin: 0 auto;
    padding: 10px 24px 60px;
  }
  .group{ margin-bottom: 34px; }
  .group-title{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing:.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .group-title::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .card{
    position:relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px 16px 22px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .card::before{
    content:"";
    position:absolute;
    left:0; top:14px; bottom:14px;
    width:3px;
    border-radius: 2px;
    background: var(--signal);
  }
  .card:hover{
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 10px 24px rgba(36,22,56,0.12);
  }
  .card-icon{
    width: 34px;
    height: 34px;
    border-radius: 9px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--grad);
    color: #fff;
    flex-shrink:0;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .card:hover .card-icon{
    transform: rotate(-8deg) scale(1.12);
  }
  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .card-title{
    font-weight: 600;
    font-size: 15px;
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    justify-content:space-between;
  }
  .card-title svg{ color:#B7BDCB; flex-shrink:0; transition: transform .2s ease; }
  .card:hover .card-title svg{ color: var(--accent); transform: translate(2px,-2px); }
  .card-desc{
    font-size: 13px;
    color: var(--muted);
    line-height: 1.45;
  }
  .card-warn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--signal);
    background: var(--signal-soft);
    padding: 4px 8px;
    border-radius: 6px;
    display:inline-block;
    width:fit-content;
  }

  .empty{
    display:none;
    text-align:center;
    padding: 60px 20px;
    color: var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  footer{
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px 50px;
    color: #A3A9B8;
    font-size: 12px;
    font-family:'IBM Plex Mono', monospace;
  }

  @media (max-width: 520px){
    header{ padding: 34px 18px 20px; }
    .controls{ padding: 8px 18px 8px; }
    main{ padding: 10px 18px 50px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-text">
      <div class="eyebrow">painel ativo</div>
      <h1>Hub <span class="nip">NIP</span></h1>
      <p>Acesso rápido aos dashboards, formulários e canais usados pelos executivos no dia a dia. Busque pelo nome ou navegue por categoria.</p>
    </div>
    <!-- Troque pela sua logo: <img src="logo.png" alt="Nome da empresa"> dentro da div abaixo -->
    <div class="logo-slot">SUA<br>LOGO</div>
  </div>
</header>

<div class="controls">
  <div class="search-row">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="Buscar painel ou sistema..." autocomplete="off">
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<main>
  <div id="results"></div>
  <div class="empty" id="empty">nenhum resultado encontrado</div>
</main>

<footer>atualizado manualmente pelo time · edite a lista LINKS no código para adicionar ou trocar itens</footer>

<script>
  // Edite esta lista para adicionar, remover ou trocar links.
  // Cada item precisa de: title, desc, url e category.
  // Itens com needsUrl:true ainda não têm um link válido — troque a url e apague essa linha.
  const LINKS = [
    { title: "Painel de Vendas", desc: "Painel com números de vendas e histórico de faturamento: metas, basket, valor das oportunidades de acordo com probabilidade etc.", url: "https://app.powerbi.com/groups/me/reports/936ef784-cd28-4b06-9a4a-7f105e2213c5/ReportSection755c40f775e9cc027278?experience=power-bi", category: "Dashboard Power BI" },
    { title: "Cobertura e Penetração", desc: "Painel para conferência dos índices de cobertura e penetração de carteira, por mês.", url: "https://app.powerbi.com/groups/me/reports/6badf35a-0af4-40c2-be80-22b5118cd5be/253adfcdcab67a0c0bd7?experience=power-bi", category: "Dashboard Power BI" },
    { title: "Visão de Mercado", desc: "Painel com dados do Ibope Monitor sobre o investimento dos clientes, setores e categorias na Globo e nos veículos concorrentes.", url: "https://app.powerbi.com/groups/me/reports/c617207e-2718-4590-86a6-8d417d62287f/ReportSection?experience=power-bi", category: "Dashboard Power BI" },
    { title: "Painel de Basket", desc: "Painel com as entradas e informações de RPs das vendas efetivadas, ou seja que já entraram no basket.", url: "https://app.powerbi.com/groups/me/reports/a823c0b3-5122-45d1-ba06-df6c339f95ee/ReportSection?experience=power-bi", category: "Dashboard Power BI" },
    { title: "Carteira Vigente", desc: "Painel com a lista de clientes na carteira de cada executivo.", url: "https://app.powerbi.com/groups/me/reports/c3472a7c-4254-41c1-8f55-8b53c78520a7/ReportSectiondc5478c2c0940b1d196d?experience=power-bi", category: "Dashboard Power BI" },
    { title: "Painel de Produtos", desc: "Painel para consulta de disponibilidade, consumo de cotas, prazos de venda e renovação e listagem de projetos e patrocínios disponíveis.", url: "https://app.powerbi.com/groups/21dc7a1f-fefb-4c1a-8798-26491fa2aa13/reports/88338b76-057b-4dcf-9497-f217bd4d839c/5d716ccc7a7928ab5b94?experience=power-bi", category: "Dashboard Power BI" },
    { title: "Painel de Desconto Vigentes", desc: "Painel para consulta pontual dos descontos vigentes dos clientes, com link para atualizar negociações.", url: "https://app.powerbi.com/groups/me/reports/cd5aa836-66d9-47b9-a0ab-e99c31857d7a/b0889f7d44bbd104851b?experience=power-bi", category: "Dashboard Power BI" },
    { title: "Gestão de Controle de Saldos", desc: "Painel para acompanhar o consumo de saldo dos clientes. Podem ser projetos, compromissos anuais, patrocínios.", url: "https://app.powerbi.com/groups/me/reports/25fb64cb-618d-4734-b80b-120a9bed9c61/ReportSection7b2908903c605a732283?experience=power-bi", category: "Dashboard Power BI" },
    { title: "Painel de Descontos - Gestão da Receita", desc: "Painel de descontos 2.0, com mais informações, visão completa das negociações dos clientes por plataforma, projeto, programas, mês, etc. Importante para ver a rentabilidade da carteira do executivo.", url: "https://app.powerbi.com/groups/me/reports/e3684441-1f67-4ac2-a320-8e66b0e0cf44/865b3ab0487a81c510e0?ctid=a7cdc447-3b29-4b41-b73e-8a2cb54b06c6&experience=power-bi", category: "Dashboard Power BI" },

    { title: "Atualização de Negociações", desc: "Formulário para consulta e atualização dos descontos de cada cliente da carteira.", url: "https://apps.powerapps.com/play/e/default-a7cdc447-3b29-4b41-b73e-8a2cb54b06c6/a/3a5af448-56bd-48bf-975c-03b0647bd237?tenantId=a7cdc447-3b29-4b41-b73e-8a2cb54b06c6&hint=5d1c8892-1250-4dba-a68c-65250f0e5cea&source=sharebutton&sourcetime=1773855662996#", category: "Formulário Power Apps" },

    { title: "Teams - Time Regionais", desc: "Canal oficial de comunicação entre as equipes regionais. Centraliza alinhamentos, comunicados, compartilhamento de materiais, acompanhamento de resultados e discussões comerciais do dia a dia.", url: "https://teams.microsoft.com/l/chat/19:6f5ad3e9e12a44ea846c43c51b5baab2@thread.v2/conversations?context=%7B%22contextType%22%3A%22chat%22%7D", category: "Microsoft Teams" },

    { title: "Cadência Semanal - Excel", desc: "Planilha em Excel para acompanhamento semanal da receita, estimativas e projeções comerciais, permitindo monitorar a tendência de fechamento do período e suportar a tomada de decisão da liderança comercial.", url: "https://tvglobocorp-my.sharepoint.com/:x:/r/personal/guilherme_fauth_g_globo/_layouts/15/Doc.aspx?sourcedoc=%7B09DEF5A9-B04E-4439-890E-6AD3F0A1EC6E%7D&file=CADENCIA%20DE%20VENDAS%20REGIONAIS%20-%20BRUNO%20LOPES.xlsx&action=default&mobileredirect=true&wdExp=TEAMS-TREATMENT&web=1&isSPOFile=1", category: "Excel Online" },

    { title: "Cadência Semanal - Claude", desc: "Documento utilizado para acompanhamento da rotina comercial, consolidando principais indicadores, prioridades da semana, evolução de metas, status de ações comerciais e alinhamentos com as lideranças.", url: "https://claude.ai/public/artifacts/21e083d3-45c5-49d1-b73c-4a62256b0cb2", category: "Claude" },

    { title: "SalesForce", desc: "Plataforma oficial de CRM para gestão comercial. Utilizada para cadastro de clientes, acompanhamento de oportunidades, pipeline de vendas, atividades comerciais, previsões de receita e gestão do funil de vendas.", url: "https://globo.my.salesforce.com/", category: "SalesForce" },

    { title: "Onboarding - #TôNaNIP", desc: "Material de integração voltado para novos colaboradores. Reúne informações corporativas, processos internos, ferramentas utilizadas, treinamentos obrigatórios e orientações para início das atividades.", url: "https://tonanip.g.globo/", category: "Treinamento NIPers" },

    { title: "Essência Globo", desc: "Portal institucional com conteúdos sobre cultura organizacional, valores, propósito, comportamento esperado, diretrizes corporativas e desenvolvimento dos colaboradores dentro da Globo.", url: "https://tvglobocorp.sharepoint.com/sites/intranetconexao/SitePages/ESSENCIA-2025.aspx?csf=1&web=1&e=ZyiLHj&CID=74e5efb2-fbd0-4e44-83e1-4291eec4444d", category: "Quem Somos" }
  ];

  const CATEGORY_ICONS = {
    "Dashboard Power BI": '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="19" x2="4" y2="10"/><line x1="10" y1="19" x2="10" y2="5"/><line x1="16" y1="19" x2="16" y2="13"/><line x1="21" y1="19" x2="21" y2="9"/></svg>',
    "Formulário Power Apps": '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg>',
    "Microsoft Teams": '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
    "Excel Online": '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>',
    "Claude": '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.6 5.2L19 9l-5.4 1.8L12 16l-1.6-5.2L5 9l5.4-1.8L12 2z"/><path d="M19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15z"/></svg>',
    "SalesForce": '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/></svg>',
    "Treinamento NIPers": '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>',
    "Quem Somos": '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>'
  };
  function categoryIcon(cat){
    return CATEGORY_ICONS[cat] || '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>';
  }

  const tabsEl = document.getElementById('tabs');
  const resultsEl = document.getElementById('results');
  const emptyEl = document.getElementById('empty');
  const searchEl = document.getElementById('search');

  const categories = ["Todos", ...new Set(LINKS.map(l => l.category))];
  let activeCategory = "Todos";

  function iconSvg(){
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
  }

  function renderTabs(){
    tabsEl.innerHTML = categories.map(cat =>
      `<div class="tab ${cat === activeCategory ? 'active' : ''}" data-cat="${cat}">${cat}</div>`
    ).join('');
    tabsEl.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        activeCategory = tab.dataset.cat;
        renderTabs();
        render();
      });
    });
  }

  function render(){
    const query = searchEl.value.trim().toLowerCase();
    const filtered = LINKS.filter(l => {
      const matchesCat = activeCategory === "Todos" || l.category === activeCategory;
      const matchesQuery = !query || l.title.toLowerCase().includes(query) || l.desc.toLowerCase().includes(query);
      return matchesCat && matchesQuery;
    });

    if(filtered.length === 0){
      resultsEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    const grouped = {};
    filtered.forEach(l => {
      if(!grouped[l.category]) grouped[l.category] = [];
      grouped[l.category].push(l);
    });

    resultsEl.innerHTML = Object.entries(grouped).map(([cat, items]) => `
      <div class="group">
        <div class="group-title">${cat}</div>
        <div class="grid">
          ${items.map(l => `
            <a class="card" href="${l.url}" target="_blank" rel="noopener">
              <div class="card-top">
                <div class="card-icon">${categoryIcon(l.category)}</div>
                <div class="card-title">${l.title} ${iconSvg()}</div>
              </div>
              <div class="card-desc">${l.desc}</div>
              ${l.needsUrl ? '<span class="card-warn">link a atualizar</span>' : ''}
            </a>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  searchEl.addEventListener('input', render);
  renderTabs();
  render();
</script>

</body>
</html>
